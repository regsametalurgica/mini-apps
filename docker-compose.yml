# ==========================================================
# Docker Compose — CEP Integração Protheus
# Container único: Frontend + Backend (sem banco de dados)
# ==========================================================

services:
  app:
    build: .
    container_name: appcep
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Configurações da API Protheus ERP
      - PROTHEUS_API_URL=http://protheus:9084/restdev
      - PROTHEUS_API_USER=RESTLOCAL
      - PROTHEUS_API_PASSWORD=@Thunder26%
      - PROTHEUS_ENDPOINT_CEP_LOAD=http://protheus:9084/restdev/reqop
      - PROTHEUS_ENDPOINT_CEP_REGISTER=http://protheus:9084/restdev/gravacep
      - PROTHEUS_ENDPOINT_CEP_RECURSOS=http://protheus:9084/restdev/recurso
      # Segurança (necessário apenas se manter o admin)
      - JWT_SECRET=secret_para_desenvolvimento
    restart: always
